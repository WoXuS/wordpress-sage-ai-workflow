server {
    listen 80;
    server_name localhost;
    root /var/app/public_html;
    index index.php;
    client_max_body_size 128M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Whistleblower attachments are confidential — no direct web access.
    # The committee downloads them via an authenticated admin endpoint.
    location ^~ /wp-content/uploads/zgloszenia/ { deny all; return 403; }

    location ~* /\.(?!well-known) { deny all; }
}
